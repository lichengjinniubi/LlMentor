      api-key: sk-ws-H.YYXREYH.HaMn.MEYCIQD9qIqcvBJpogTBFWDKAUUYwrB9jv7CsBpQD1A_Qf8GBQIhALmU1VnnKbePP4aIlMIzmurZmhyIPdoV_PSEnqhN8NSQ
    mcp:
      server:
        enabled: true
        protocol: STREAMABLE
        name: streamable-mcp-server
